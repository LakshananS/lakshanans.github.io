name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

# Required permissions for the official Pages deployment actions
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # CRITICAL: must match the environment name where your secrets live
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create config.js from secrets
        run: |
          echo "const config = {" > config.js
          echo "    EMAILJS_PUBLIC_KEY: \"${{ secrets.EMAILJS_PUBLIC_KEY }}\"," >> config.js
          echo "    EMAILJS_SERVICE_ID: \"${{ secrets.EMAILJS_SERVICE_ID }}\"," >> config.js
          echo "    EMAILJS_TEMPLATE_ID: \"${{ secrets.EMAILJS_TEMPLATE_ID }}\"" >> config.js
          echo "};" >> config.js

      - name: Verify config.js was generated
        run: cat config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Uploads all files (including generated config.js) as a Pages artifact.
      # .nojekyll in the repo root tells this action to skip Jekyll,
      # so config.js is never excluded.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
